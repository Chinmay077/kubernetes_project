# ============================================================
# MiniMart Frontend – Deployment
# ============================================================
# Teaching notes:
#   • 3 replicas → students refresh the shop page and see
#     different pod names, proving the NodePort load-balances.
#   • BACKEND_URL uses the Kubernetes DNS name of the backend
#     Service – no hard-coded IP addresses.
#   • imagePullPolicy: Never → uses locally-built Minikube image.
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimart-frontend
  labels:
    app: minimart-frontend
    tier: frontend
    version: "1.0.0"
spec:
  replicas: 3

  selector:
    matchLabels:
      app: minimart-frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: minimart-frontend
        tier: frontend
        version: "1.0.0"
    spec:
      containers:
        - name: frontend
          image: minimart-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_VERSION
              value: "1.0.0"
            # ← KEY K8s CONCEPT: use DNS, never pod IPs
            - name: BACKEND_URL
              value: "http://minimart-backend-svc:5000"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

---
# ============================================================
# MiniMart Frontend – NodePort Service
# ============================================================
# NodePort exposes the Service on every cluster node's IP at
# port 30080. In Minikube, access via:
#   minikube service minimart-frontend-svc --url
#   OR  http://$(minikube ip):30080
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: minimart-frontend-svc
  labels:
    app: minimart-frontend
    tier: frontend
spec:
  type: NodePort
  selector:
    app: minimart-frontend
  ports:
    - name: http
      port: 8080          # Service port (cluster-internal)
      targetPort: 8080    # Container port
      nodePort: 30080     # External port on the Node (30000-32767)
      protocol: TCP
